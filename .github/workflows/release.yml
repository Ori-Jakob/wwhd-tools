name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from main, e.g. 1.2.0 (tagged v1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: check
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -e
          v="${INPUT#v}"
          if ! [[ "$v" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::'$INPUT' is not a usable version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "::error::tag v$v already exists"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tools:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}

  randopack:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet publish tools/RandoPack -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$env:VERSION -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path publish/* -DestinationPath "WWHD-Tools-RandoPack-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WWHD-Tools-RandoPack-${{ needs.prepare.outputs.version }}
          path: WWHD-Tools-RandoPack-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: error

  release:
    needs: [prepare, tools, randopack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: WWHD Tools v${{ needs.prepare.outputs.version }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.zip
