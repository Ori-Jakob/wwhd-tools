# Builds wwhd_tools.rpl and the rpl-loader plugin and packs WWHD-Tools-<version>.zip.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Trust the checkout
        run: git config --global --add safe.directory '*'

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 zip bzip2

      - name: Cache WUPS and WUMS
        id: wups-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/devkitpro/wups
            /opt/devkitpro/wums
          key: wups-wums-${{ runner.os }}-v2

      - name: Install WUPS and WUMS from source
        if: steps.wups-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/deps && cd /tmp/deps
          # Serial on purpose: libmappedmemory's install moves its .ld before -j has built it.
          for repo in libfunctionpatcher libmappedmemory libkernel libnotifications WiiUPluginSystem; do
            git clone "https://github.com/wiiu-env/$repo.git"
            make -C "$repo" install
          done

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build rpl_loader.wps
        run: make -C external/wii-u-rpl-loader -j"$(nproc)"

      - name: Build wwhd_tools.rpl
        run: make -j"$(nproc)" VERSION="${{ steps.version.outputs.version }}"

      - name: Package
        run: |
          set -e
          V="${{ steps.version.outputs.version }}"
          S=dist/WWHD-Tools
          rm -rf dist && mkdir -p \
            "$S/Cemu/WWHD-Tools/code" \
            "$S/Wii U/wiiu/environments/aroma/plugins" \
            "$S/Wii U/wiiu/rpl-loader/universal"
          cp Cemu/graphicspack/*                      "$S/Cemu/WWHD-Tools/"
          cp wwhd_tools.rpl                           "$S/Cemu/WWHD-Tools/code/"
          cp external/wii-u-rpl-loader/rpl_loader.wps "$S/Wii U/wiiu/environments/aroma/plugins/"
          cp wwhd_tools.rpl                           "$S/Wii U/wiiu/rpl-loader/universal/"
          (cd "$S" && zip -r -X "../WWHD-Tools-$V.zip" .)
          unzip -l "dist/WWHD-Tools-$V.zip"
          echo "zip=dist/WWHD-Tools-$V.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WWHD-Tools-${{ steps.version.outputs.version }}
          path: ${{ env.zip }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.zip }}
          generate_release_notes: true
